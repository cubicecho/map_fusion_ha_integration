set_area:
  fields:
    area_id:
      required: true
      selector:
        area:
    frame_id:
      example: "vacuum.d10_plus:46"
      selector:
        text:
    x:
      example: 1.5
      selector:
        number:
          min: -1000
          max: 1000
          step: 0.01
          unit_of_measurement: m
          mode: box
    y:
      example: 0.5
      selector:
        number:
          min: -1000
          max: 1000
          step: 0.01
          unit_of_measurement: m
          mode: box
    width:
      example: 2.4
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          unit_of_measurement: m
          mode: box
    height:
      example: 3
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          unit_of_measurement: m
          mode: box
    polygons:
      example: "[[[0, 0], [2, 0], [2, 3], [0, 3]]]"
      selector:
        object:
clear_area:
  fields:
    area_id:
      required: true
      selector:
        area:
    frame_id:
      example: "vacuum.d10_plus:46"
      selector:
        text:
get_map:
  fields:
    frame_id:
      example: "vacuum.d10_plus:46"
      selector:
        text:
    variant:
      default: traced
      selector:
        select:
          translation_key: variant
          options:
            - traced
            - filled
transform_point:
  fields:
    frame_id:
      example: "vacuum.d10_plus:46"
      selector:
        text:
    source_id:
      example: vacuum.d10_plus
      selector:
        entity:
          domain: vacuum
    x:
      required: true
      example: 2.5
      selector:
        number:
          min: -100000
          max: 100000
          step: any
          mode: box
    y:
      required: true
      example: 1.5
      selector:
        number:
          min: -100000
          max: 100000
          step: any
          mode: box
    to:
      default: source
      selector:
        select:
          translation_key: transform_to
          options:
            - source
            - frame
locate_point:
  fields:
    frame_id:
      example: "vacuum.d10_plus:46"
      selector:
        text:
    source_id:
      example: vacuum.d10_plus
      selector:
        entity:
          domain: vacuum
    x:
      required: true
      example: 2.5
      selector:
        number:
          min: -100000
          max: 100000
          step: any
          mode: box
    y:
      required: true
      example: 1.5
      selector:
        number:
          min: -100000
          max: 100000
          step: any
          mode: box
    variant:
      default: traced
      selector:
        select:
          translation_key: variant
          options:
            - traced
            - filled
