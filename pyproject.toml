[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-fusion-ha-integration"
version = "0.2.0"
description = "Home Assistant integration that fuses robot vacuum maps into one area-aware floor map"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
packages = ["custom_components.map_fusion"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "PyTurboJPEG<2",  # needed to import HA's camera component
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
